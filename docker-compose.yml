version: '3'

services:

  mrozoversum:

    container_name: mrozoversum_app

    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "3000:3000"

    restart: always

  ngrok:

    container_name: mrozoversum_ngrok

    image: ngrok/ngrok:latest

    command: http mrozoversum:3000

    depends_on:
      - mrozoversum

    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}

    restart: always